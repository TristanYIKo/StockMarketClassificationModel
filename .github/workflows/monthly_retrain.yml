name: Monthly retrain

# Retrains all three horizons on the full history and commits the refreshed
# artifacts. Two jobs in one:
#
#   1. It chooses the algorithm and decision threshold per horizon (on the
#      fixed 2024 validation window) and scores that choice walk-forward over
#      the test period: one model per day, each fit only on labels known by
#      that day's close. The daily job refits the same way every evening, so
#      what is served never stops learning from recent markets.
#   2. GitHub disables scheduled workflows in repositories with no commit
#      activity for 60 days. A scheduled run does NOT count as activity, but the
#      commit this job pushes does -- so this is also what keeps the daily
#      pipeline from silently switching itself off.
on:
  schedule:
    - cron: '30 6 1 * *'   # 06:30 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      backfill_from:
        description: 'Rebuild stored predictions from this date after retraining.'
        required: false
        default: '2025-01-01'
        type: string

concurrency:
  group: retrain
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    # The walk-forward fits one model per test day per horizon (~470 each, more
    # every month). With the current winners -- logistic regression at 1d/5d,
    # XGBoost at 20d -- that is ~45 minutes. A random-forest winner costs ~9s a
    # fit, ~70 minutes per horizon, so the ceiling allows for the worst case.
    timeout-minutes: 300
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Bypasses RLS. Required once migration 017 is applied, or every
      # write below is silently rejected.
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r ml/requirements.txt

      - name: Refresh data before training
        run: python run_etl.py --mode incremental

      - name: Train all horizons
        run: python -m ml.src.train.train --all --no-cache

      - name: Rebuild stored predictions walk-forward
        # Every past day is scored by its own model, fit on labels known by
        # that day's close. Reuses the per-day calls the training step just
        # wrote to reports/<h>/walk_forward.csv, so nothing is fit twice.
        run: |
          python -m ml.src.predict.predict --backfill "${{ inputs.backfill_from || '2025-01-01' }}"

      - name: Show report
        run: cat ml/artifacts/reports/model_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ml/artifacts/models ml/artifacts/reports
          if git diff --staged --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "chore: monthly retrain $(date -u +%Y-%m-%d)"
            git push
          fi
